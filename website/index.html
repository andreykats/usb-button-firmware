<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32-S3 Serial Debugger</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2e3147;
      --text:      #e2e4ef;
      --muted:     #6b7095;
      --green:     #22c55e;
      --blue:      #3b82f6;
      --orange:    #f97316;
      --red:       #ef4444;
      --yellow:    #eab308;
      --purple:    #a855f7;
      --cyan:      #06b6d4;
      --mono:      "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--blue); }
    #status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    #status-dot.green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    #status-dot.blue   { background: var(--blue);  box-shadow: 0 0 6px var(--blue);  }
    #status-dot.red    { background: var(--red);   box-shadow: 0 0 6px var(--red);   }

    /* ── Controls bar ── */
    #controls {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--surface);
    }
    #controls label { font-size: 12px; color: var(--muted); }
    #controls input[type=text] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 13px;
      width: 160px;
      outline: none;
      transition: border-color 0.2s;
    }
    #controls input:focus { border-color: var(--blue); }
    .sep { color: var(--border); }

    button {
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:hover:not(:disabled) { opacity: 0.85; }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #btn-connect { background: var(--blue); color: #fff; }
    #btn-connect.pulse {
      animation: connectPulse 1.6s ease-in-out infinite;
      box-shadow: 0 0 0 0 rgba(59,130,246,0.7);
    }
    @keyframes connectPulse {
      0%   { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
      60%  { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
      100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }
    #btn-disconnect-all { background: var(--red); color: #fff; }
    #connect-hint {
      font-size: 11px; color: var(--yellow);
      display: flex; align-items: center; gap: 5px;
    }
    #btn-clear { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    /* ── Main grid: 3 panels ── */
    #panels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      #panels { grid-template-columns: 1fr; }
    }
    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel:last-child { border-right: none; }
    .panel-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
    }
    .panel-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .panel-subtitle { font-size: 11px; color: var(--muted); }
    .channel-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .channel-dot.active { background: var(--green); box-shadow: 0 0 5px var(--green); }
    #dot-hid.active    { background: var(--purple); box-shadow: 0 0 5px var(--purple); }
    #dot-serial.active { background: var(--green);  box-shadow: 0 0 5px var(--green);  }
    #dot-espnow.active { background: var(--cyan);   box-shadow: 0 0 5px var(--cyan);   }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      display: flex;
      flex-direction: column-reverse; /* newest at top */
    }
    .panel-body p {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .panel-row-empty .event-key,
    .panel-row-empty .event-delta,
    .panel-row-empty .event-time {
      visibility: hidden;
    }
    .event-key  { color: var(--text); font-weight: 600; font-size: 15px; }
    .event-delta {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
    }
    .delta-fast { background: rgba(34,197,94,0.15);  color: var(--green); }
    .delta-mid  { background: rgba(59,130,246,0.15); color: var(--blue);  }
    .delta-slow { background: rgba(239,68,68,0.15);  color: var(--red);   }
    .event-time { color: var(--muted); font-size: 10px; margin-left: auto; }
    .panel-empty { color: var(--muted); font-style: italic; font-size: 11px; padding: 8px 0; }

    /* ── Console log ── */
    #console-section {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }
    #console-header {
      padding: 8px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #console-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 24px;
      font-family: var(--mono);
      font-size: 11px;
      display: flex;
      flex-direction: column-reverse;
    }
    #console-body p {
      padding: 2px 0;
      line-height: 1.5;
    }
    .log-ts   { color: var(--muted); margin-right: 6px; }
    .log-info { color: var(--text); }
    .log-warn { color: var(--yellow); }
    .log-err  { color: var(--red); }
    .log-ok   { color: var(--green); }
    .log-data { color: var(--blue); }
  </style>
</head>
<body>
<!-- ── Device insertion toast ── -->
<div id="device-toast" style="
  display:none; position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#1e293b; border:1px solid #3b82f6; border-radius:10px;
  padding:14px 20px; z-index:999; box-shadow:0 4px 24px rgba(0,0,0,0.5);
  display:none; align-items:center; gap:14px; font-size:13px; min-width:340px;">
  <span style="font-size:20px">🔌</span>
  <div>
    <div style="font-weight:600; color:#e2e4ef">ESP32-S3 detected</div>
    <div style="color:#6b7095; font-size:11px" id="toast-sub">Click Connect to pair</div>
  </div>
  <button onclick="connectSerial(); hideToast()" style="
    background:#3b82f6; color:#fff; border:none; border-radius:6px;
    padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; margin-left:auto">
    Connect
  </button>
  <button onclick="hideToast()" style="
    background:transparent; color:#6b7095; border:none; font-size:16px;
    cursor:pointer; padding:0 4px; line-height:1">×</button>
</div>

<!-- ── Header ── -->
<header>
  <h1>ESP32-S3 Serial Debugger</h1>
  <div id="status-badge">
    <div id="status-dot"></div>
    <span id="status-text">Disconnected</span>
  </div>
</header>

<!-- ── Controls ── -->
<div id="controls">
  <button id="btn-connect">Connect to Device</button>
  <button id="btn-disconnect-all" style="display:none">Disconnect All</button>
  <button id="btn-clear">Clear All</button>
  <span class="sep" id="key-sep" style="display:none">|</span>
  <label id="key-label" style="display:none">Device Key</label>
  <input type="text" id="device-key" maxlength="1" placeholder="Q"
    style="display:none; width:48px; text-align:center; text-transform:uppercase; font-weight:700; font-size:15px"
    title="Single letter or digit this device sends on button press">
  <button id="btn-set-key" style="display:none; background:var(--orange); color:#fff">Set Key</button>
  <span id="connect-hint" style="display:none">
    ← Plug in your ESP32-S3 then click Connect
  </span>
</div>

<!-- ── Three channel panels ── -->
<div id="panels">

  <!-- HID panel -->
  <div class="panel" id="panel-hid">
    <div class="panel-header">
      <div class="channel-dot" id="dot-hid"></div>
      <div>
        <div class="panel-title" style="color:#a855f7">HID Keyboard</div>
      </div>
    </div>
    <div class="panel-body" id="body-hid">
      <p class="panel-empty" id="hid-empty">Waiting for keystrokes...</p>
    </div>
  </div>

  <!-- Serial panel -->
  <div class="panel" id="panel-serial">
    <div class="panel-header">
      <div class="channel-dot" id="dot-serial"></div>
      <div>
        <div class="panel-title" style="color:#22c55e">Web Serial</div>
      </div>
    </div>
    <div class="panel-body" id="body-serial">
      <p class="panel-empty" id="serial-empty">Waiting for serial connection...</p>
    </div>
  </div>

  <!-- ESP-NOW Relay panel -->
  <div class="panel" id="panel-espnow">
    <div class="panel-header">
      <div class="channel-dot" id="dot-espnow"></div>
      <div>
        <div class="panel-title" style="color:#06b6d4">ESP-NOW Relay</div>
      </div>
    </div>
    <div class="panel-body" id="body-espnow">
      <p class="panel-empty" id="espnow-empty">Waiting for remote devices...</p>
    </div>
  </div>

</div>

<!-- ── Console log ── -->
<div id="console-section">
  <div id="console-header">
    Console Log
    <span style="color:var(--muted); font-weight:400; font-size:10px" id="log-count">0 entries</span>
  </div>
  <div id="console-body"></div>
</div>

<script>
'use strict';
// ══════════════════════════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════════════════════════
let serialPort   = null;
let serialWriter = null;
let serialReader = null;

// Press event tracking — group arrivals across channels by timestamp proximity
// Each press keeps one synchronized row per channel so columns align by row index.
const pressEvents = [];
const PRESS_WINDOW_MS = 300;
const MAX_PRESS_ROWS = 100;

let logCount = 0;

// USB filters for supported devices
const DEVICE_FILTERS = [
  { usbVendorId: 0x239A, usbProductId: 0x8143 },  // QT Py ESP32-S3
  { usbVendorId: 0x239A, usbProductId: 0x8144 },  // QT Py ESP32-S3 (CDC)
  { usbVendorId: 0x303A, usbProductId: 0x1001 },  // ESP32-S3-Matrix (ESP32S3 Dev Module) / M5StickS3
];

// ══════════════════════════════════════════════════════════════════════════
// DOM refs
// ══════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

const statusDot  = $('status-dot');
const statusText = $('status-text');
const btnConnect = $('btn-connect');
const btnDisconnAll = $('btn-disconnect-all');
const btnClear   = $('btn-clear');
const consoleBody = $('console-body');
const CHANNEL_ORDER = ['hid', 'serial', 'espnow'];
const PANEL_BY_CHANNEL = {
  hid:    { body: $('body-hid'),    emptyId: 'hid-empty' },
  serial: { body: $('body-serial'), emptyId: 'serial-empty' },
  espnow: { body: $('body-espnow'), emptyId: 'espnow-empty' },
};
const panelBodies = CHANNEL_ORDER.map(ch => PANEL_BY_CHANNEL[ch].body);

function syncPanelScroll(bodies) {
  let syncing = false;
  for (const body of bodies) {
    body.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      for (const other of bodies) {
        if (other !== body) other.scrollTop = body.scrollTop;
      }
      syncing = false;
    }, { passive: true });
  }
}
syncPanelScroll(panelBodies);

// ══════════════════════════════════════════════════════════════════════════
// Logging
// ══════════════════════════════════════════════════════════════════════════
function wallTimeStr() {
  const d = new Date();
  return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function log(msg, cls = 'log-info') {
  logCount++;
  $('log-count').textContent = logCount + ' entries';
  const p = document.createElement('p');
  p.innerHTML = `<span class="log-ts">[${wallTimeStr()}]</span><span class="${cls}">${escHtml(msg)}</span>`;
  consoleBody.prepend(p);
  while (consoleBody.children.length > 200) consoleBody.removeChild(consoleBody.lastChild);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ══════════════════════════════════════════════════════════════════════════
// Status indicator
// ══════════════════════════════════════════════════════════════════════════
function setStatus(text, dotClass) {
  statusText.textContent = text;
  statusDot.className = dotClass || '';
}

// ══════════════════════════════════════════════════════════════════════════
// Channel dot helpers
// ══════════════════════════════════════════════════════════════════════════
function flashDot(dotId) {
  const d = $(dotId);
  d.classList.add('active');
  setTimeout(() => d.classList.remove('active'), 600);
}

// ══════════════════════════════════════════════════════════════════════════
// Panel event rendering
// ══════════════════════════════════════════════════════════════════════════
function createPanelRow() {
  const p = document.createElement('p');
  p.className = 'panel-row-empty';
  p.innerHTML =
    '<span class="event-key">&nbsp;</span>' +
    '<span class="event-delta"></span>' +
    '<span class="event-time"></span>';
  return p;
}

function setPanelRowBlank(rowEl) {
  rowEl.classList.add('panel-row-empty');
  rowEl.querySelector('.event-key').textContent = '\u00A0';
  rowEl.querySelector('.event-delta').textContent = '';
  rowEl.querySelector('.event-delta').className = 'event-delta';
  rowEl.querySelector('.event-time').textContent = '';
}

function setPanelRowData(rowEl, label, delta, timeText) {
  rowEl.classList.remove('panel-row-empty');
  rowEl.querySelector('.event-key').textContent = label;
  const span = rowEl.querySelector('.event-delta');
  const ms = delta.toFixed(1);
  span.textContent = `+${ms}ms`;
  span.className = 'event-delta ' +
    (delta < 1 ? 'delta-fast' : delta < 30 ? 'delta-mid' : 'delta-slow');
  rowEl.querySelector('.event-time').textContent = timeText;
}

function createPressRows() {
  const press = { timestamps: {}, labels: {}, wallTimes: {}, rows: {} };
  for (const ch of CHANNEL_ORDER) {
    const panel = PANEL_BY_CHANNEL[ch];
    const empty = $(panel.emptyId);
    if (empty) empty.remove();
    const row = createPanelRow();
    panel.body.prepend(row);
    press.rows[ch] = row;
  }
  return press;
}

function trimPressRows() {
  while (pressEvents.length > MAX_PRESS_ROWS) {
    const old = pressEvents.shift();
    for (const ch of CHANNEL_ORDER) {
      const row = old.rows[ch];
      if (row && row.parentNode) row.parentNode.removeChild(row);
    }
  }
}

function addPanelEvent(label, channel, ts) {
  // Find an existing press within the time window that:
  // 1. Doesn't have this channel yet
  // 2. Has the same key label (to avoid grouping different devices together)
  let press = null;
  for (let i = pressEvents.length - 1; i >= 0; i--) {
    const p = pressEvents[i];
    const minTs = Math.min(...Object.values(p.timestamps));
    const existingLabels = Object.values(p.labels);
    const sameKey = existingLabels.length === 0 || existingLabels.some(l => l === label);
    if (Math.abs(ts - minTs) < PRESS_WINDOW_MS && p.timestamps[channel] == null && sameKey) {
      press = p;
      break;
    }
  }
  if (!press) {
    press = createPressRows();
    pressEvents.push(press);
    trimPressRows();
  }
  press.timestamps[channel] = ts;
  press.labels[channel] = label;
  press.wallTimes[channel] = wallTimeStr();

  // Recompute deltas for all channels in this press
  const minTs = Math.min(...Object.values(press.timestamps));
  for (const ch of CHANNEL_ORDER) {
    const el = press.rows[ch];
    if (press.timestamps[ch] == null) {
      setPanelRowBlank(el);
      continue;
    }
    const delta = press.timestamps[ch] - minTs;
    setPanelRowData(el, press.labels[ch], delta, press.wallTimes[ch]);
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Serial — parse incoming lines
// ══════════════════════════════════════════════════════════════════════════
function parseSerialLine(line, ts) {
  log(`Serial ← ${line}`, 'log-data');

  if (line === 'READY') {
    log('Device ready', 'log-ok');
    setStatus('Serial connected', 'green');
    $('dot-serial').classList.add('active');
    return;
  }

  if (line === 'PRIMARY') {
    log('This device is now the primary hub', 'log-ok');
    setStatus('Primary (ESP-NOW hub)', 'green');
    return;
  }

  // ESP-NOW relay: keystroke from remote device
  if (line.startsWith('RELAY:')) {
    const key = line.slice(6).trim();
    if (key.length === 1) {
      addPanelEvent(key, 'espnow', ts);
      flashDot('dot-espnow');
    }
    return;
  }

  // Remote peer joined
  if (line.startsWith('PEER:')) {
    const key = line.slice(5).trim();
    log(`Remote device [${key}] joined via ESP-NOW`, 'log-ok');
    return;
  }

  // Peer count update
  if (line.startsWith('PEERS:')) {
    const count = line.slice(6).trim();
    log(`${count} remote device(s) active`, 'log-info');
    return;
  }

  // Radar presence sensor events
  if (line.startsWith('RADAR:')) {
    const payload = line.slice(6);
    if (payload === 'PRESENT') { log('Radar: presence detected', 'log-ok'); return; }
    if (payload === 'CLEARED') { log('Radar: presence cleared', 'log-info'); return; }
    // Periodic data frame (md=...,me=...,sd=...,se=...,p=0/1) — logged as raw data
    return;
  }

  // Radar configuration responses
  if (line.startsWith('RADAR_CFG:') || line === 'RADAR_CFG_OK') {
    log(`Radar config: ${line}`, 'log-ok');
    return;
  }

  // Single-character message = button press key (from this device directly)
  if (line.length === 1) {
    addPanelEvent(line, 'serial', ts);
    flashDot('dot-serial');
    return;
  }

  if (line.startsWith('CONFIG:key=')) {
    const k = line.slice(11).trim().toUpperCase();
    $('device-key').value = k;
    setDeviceKeyUI(true);
    log(`Device key: ${k}`, 'log-ok');
    return;
  }

  if (line.startsWith('KEY_SAVED:')) {
    const msg = line.slice(10);
    log(`Key saved — ${msg}`, 'log-ok');
    sendSerial('REBOOT\n');
    log('Rebooting device to apply new key...', 'log-info');
    return;
  }

  if (line === 'REBOOTING...') {
    log('Device rebooting — reconnecting in 3s...', 'log-warn');
    setDeviceKeyUI(false);
    return;
  }

  if (line.startsWith('LOG:')) {
    const payload = line.slice(4);
    log(`[device] ${payload}`, 'log-info');
    return;
  }

  if (line.startsWith('ERR:')) {
    log(`[device ERROR] ${line.slice(4)}`, 'log-err');
    return;
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Serial — async read loop
// ══════════════════════════════════════════════════════════════════════════
async function readSerialLoop() {
  const textDecoder = new TextDecoderStream();
  serialPort.readable.pipeTo(textDecoder.writable).catch(() => {});
  const reader = textDecoder.readable.getReader();
  serialReader = reader;

  let lineBuffer = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      const readTs = performance.now();
      lineBuffer += value;
      let nl;
      while ((nl = lineBuffer.indexOf('\n')) !== -1) {
        const line = lineBuffer.slice(0, nl).replace(/\r$/, '').trim();
        lineBuffer  = lineBuffer.slice(nl + 1);
        if (line.length > 0) parseSerialLine(line, readTs);
      }
    }
  } catch (e) {
    if (serialPort) log(`Serial read error: ${e.message}`, 'log-err');
  } finally {
    reader.releaseLock();
  }
  log('Serial read loop ended', 'log-warn');
  onSerialDisconnected();
}

// ══════════════════════════════════════════════════════════════════════════
// Serial write helper
// ══════════════════════════════════════════════════════════════════════════
async function sendSerial(text) {
  if (!serialWriter) { log('Serial not connected', 'log-err'); return; }
  try {
    await serialWriter.write(text);
  } catch (e) {
    log(`Serial write error: ${e.message}`, 'log-err');
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Device key config UI
// ══════════════════════════════════════════════════════════════════════════
function setDeviceKeyUI(visible) {
  ['key-sep','key-label','device-key','btn-set-key'].forEach(id => {
    $(id).style.display = visible ? (id === 'device-key' ? 'inline-block' : '') : 'none';
  });
}

async function setDeviceKey() {
  const k = $('device-key').value.trim().toUpperCase();
  if (!/^[A-Z0-9]$/.test(k)) {
    log('Key must be a single letter (A-Z) or digit (0-9)', 'log-warn');
    return;
  }
  log(`Setting device key to "${k}" — device will reboot to apply`, 'log-info');
  await sendSerial(`KEY:${k}\n`);
}

// Enforce single alphanumeric character in key input
$('device-key').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(-1);
});

$('btn-set-key').addEventListener('click', setDeviceKey);

// ══════════════════════════════════════════════════════════════════════════
// Connect / disconnect serial
// ══════════════════════════════════════════════════════════════════════════
function showToast(sub) {
  const t = $('device-toast');
  if (sub) $('toast-sub').textContent = sub;
  t.style.display = 'flex';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(hideToast, 12000);
}
function hideToast() {
  $('device-toast').style.display = 'none';
  clearTimeout(showToast._timer);
}

async function connectSerial() {
  if (!('serial' in navigator)) {
    log('Web Serial API not available — use Chrome 89+ and serve from localhost', 'log-err');
    return;
  }
  hideToast();

  try {
    serialPort = await navigator.serial.requestPort({ filters: DEVICE_FILTERS });
  } catch (e) {
    if (e.name !== 'NotAllowedError') log(`Port selection error: ${e.message}`, 'log-err');
    return;
  }

  try {
    await serialPort.open({ baudRate: 115200 });
  } catch (e) {
    log(`Failed to open serial port: ${e.message}`, 'log-err');
    serialPort = null;
    return;
  }

  log('Serial port opened at 115200 baud', 'log-ok');
  setStatus('Serial connected', 'green');
  setConnectHint(false);
  btnConnect.style.display = 'none';
  btnDisconnAll.style.display = '';
  btnDisconnAll.style.display = '';

  const textEncoder = new TextEncoderStream();
  textEncoder.readable.pipeTo(serialPort.writable).catch(() => {});
  serialWriter = textEncoder.writable.getWriter();

  readSerialLoop();
}

function onSerialDisconnected() {
  serialPort   = null;
  serialWriter = null;
  serialReader = null;
  setStatus('Disconnected', '');
  $('dot-serial').classList.remove('active');
  $('dot-espnow').classList.remove('active');
  btnConnect.textContent = 'Connect to Device';
  btnConnect.style.display = '';
  btnDisconnAll.style.display = 'none';
  btnDisconnAll.style.display = 'none';
  setDeviceKeyUI(false);
  setConnectHint(true);
  log('Device disconnected', 'log-warn');
}

async function disconnectSerial() {
  if (serialReader) { try { await serialReader.cancel(); } catch(_) {} }
  if (serialWriter) { try { await serialWriter.close(); } catch(_) {} }
  if (serialPort)   { try { await serialPort.close(); }   catch(_) {} }
  onSerialDisconnected();
}

async function disconnectAll() {
  await disconnectSerial();
  try {
    const ports = await navigator.serial.getPorts();
    for (const port of ports) {
      try { await port.close(); } catch(_) {}
      try { await port.forget(); } catch(_) {}
    }
    if (ports.length > 0) log(`Forgot ${ports.length} paired device(s)`, 'log-ok');
    else log('No paired devices to forget', 'log-info');
  } catch (e) {
    log(`Disconnect all failed: ${e.message}`, 'log-err');
  }
}

// ══════════════════════════════════════════════════════════════════════════
// HID (keyboard) capture — accept any alphanumeric key from any device
// ══════════════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const key = e.key.toUpperCase();
  if (!/^[A-Z0-9]$/.test(key)) return;
  e.preventDefault();

  const ts = performance.now();
  log(`HID keydown: "${key}"`, 'log-data');
  addPanelEvent(key, 'hid', ts);
  flashDot('dot-hid');
});

// ══════════════════════════════════════════════════════════════════════════
// Clear
// ══════════════════════════════════════════════════════════════════════════
btnClear.addEventListener('click', () => {
  ['body-hid','body-serial','body-espnow'].forEach(id => {
    $(id).innerHTML = '';
  });
  consoleBody.innerHTML = '';
  pressEvents.length = 0;
  logCount = 0;
  $('log-count').textContent = '0 entries';
  [
    ['hid-empty',    'body-hid',    'Waiting for keystrokes...'],
    ['serial-empty', 'body-serial', 'Waiting for serial connection...'],
    ['espnow-empty', 'body-espnow', 'Waiting for remote devices...'],
  ].forEach(([emptyId, bodyId, text]) => {
    const p = document.createElement('p');
    p.className = 'panel-empty';
    p.id = emptyId;
    p.textContent = text;
    $(bodyId).appendChild(p);
  });
  panelBodies.forEach(body => { body.scrollTop = 0; });
  log('Cleared all data', 'log-info');
});

// ══════════════════════════════════════════════════════════════════════════
// Button wiring
// ══════════════════════════════════════════════════════════════════════════
btnConnect.addEventListener('click', connectSerial);
btnDisconnAll.addEventListener('click', disconnectAll);

// ══════════════════════════════════════════════════════════════════════════
// Device insertion / removal detection
// ══════════════════════════════════════════════════════════════════════════
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', async e => {
    log('USB serial device connected', 'log-ok');
    const ports = await navigator.serial.getPorts();
    const knownPort = ports.find(p => p === e.target);
    if (knownPort && !serialPort) {
      log('Known device — auto-reconnecting...', 'log-ok');
      serialPort = knownPort;
      try {
        await serialPort.open({ baudRate: 115200 });
        setStatus('Serial connected', 'green');
        setConnectHint(false);
        btnConnect.style.display = 'none';
        btnDisconnAll.style.display = '';
        btnDisconnAll.style.display = '';
        const enc = new TextEncoderStream();
        enc.readable.pipeTo(serialPort.writable).catch(() => {});
        serialWriter = enc.writable.getWriter();
        readSerialLoop();
      } catch (err) {
        log(`Auto-connect on insert failed: ${err.message}`, 'log-warn');
        serialPort = null;
        showToast('Click Connect to pair');
      }
    } else if (!serialPort) {
      showToast('Click Connect to pair');
    }
  });

  navigator.serial.addEventListener('disconnect', e => {
    log('USB serial device removed', 'log-warn');
    hideToast();
    if (serialPort) onSerialDisconnected();
  });
}

// ══════════════════════════════════════════════════════════════════════════
// Auto-reconnect on page load
// ══════════════════════════════════════════════════════════════════════════
function setConnectHint(visible) {
  $('connect-hint').style.display = visible ? 'flex' : 'none';
  if (visible) btnConnect.classList.add('pulse');
  else btnConnect.classList.remove('pulse');
}

async function autoReconnect() {
  if (!('serial' in navigator)) return;
  try {
    const ports = await navigator.serial.getPorts();
    if (ports.length === 0) {
      setConnectHint(true);
      log('No paired device found — plug in the ESP32-S3 and click Connect', 'log-warn');
      return;
    }
    log(`Auto-reconnecting to previously paired device...`, 'log-ok');
    serialPort = ports[0];
    try {
      await serialPort.open({ baudRate: 115200 });
    } catch (e) {
      let opened = false;
      for (let attempt = 0; attempt < 3 && !opened; attempt++) {
        await new Promise(r => setTimeout(r, 200));
        try { await serialPort.open({ baudRate: 115200 }); opened = true; }
        catch (retryErr) { if (attempt === 2) throw retryErr; }
      }
    }
    log('Serial port re-opened (auto-reconnect)', 'log-ok');
    setStatus('Serial connected', 'green');
    setConnectHint(false);
    btnConnect.style.display = 'none';
    btnDisconnAll.style.display = '';
    btnDisconnAll.style.display = '';
    const textEncoder = new TextEncoderStream();
    textEncoder.readable.pipeTo(serialPort.writable).catch(() => {});
    serialWriter = textEncoder.writable.getWriter();
    readSerialLoop();
  } catch (e) {
    log(`Auto-reconnect failed: ${e.message}`, 'log-warn');
    serialPort = null;
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════════════════════════════
log('Page loaded — plug in your ESP32-S3 and click "Connect to Device"', 'log-info');
log('NOTE: Click the page (not an input field) to capture HID keystrokes', 'log-warn');
if (!('serial' in navigator)) {
  log('Web Serial API not detected — ensure you are using Chrome 89+ and serving from localhost:8080', 'log-err');
} else {
  autoReconnect();
}
</script>
